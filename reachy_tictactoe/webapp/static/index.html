<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe Reachy — MIA La Maison de l'IA</title>
    <link rel="icon" type="image/png" href="/static/mia-logo-blanc.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <style>
        :root {
            /* Charte MIA */
            --mia-navy: #1a3a5c;
            --mia-navy-light: #2a5a8c;
            --mia-navy-dark: #0d2840;
            --mia-deep: #0C1A2A;
            --mia-terracotta: #b5605a;
            --mia-terracotta-light: #d4847e;
            --mia-terracotta-dark: #8a4a45;

            --text-primary: #f0f4f8;
            --text-secondary: #b8c8d8;
            /* Charte MIA : #7a95b0. Relevé ici car sur nos cartes en verre
               il tombait sous le seuil de contraste AA (4,5:1) pour du
               petit texte — sous-titre et intitulés de cartes. */
            --text-muted: #9db3c9;

            --panel: rgba(255, 255, 255, 0.12);
            --panel-strong: rgba(255, 255, 255, 0.16);
            --border: rgba(255, 255, 255, 0.16);
            --border-strong: rgba(255, 255, 255, 0.28);

            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.30);
            --shadow-glow: 0 0 40px rgba(181, 96, 90, 0.25);
            --radius: 18px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Sur des boutons à dégradé et ombres, le contour par défaut du
           navigateur est quasi invisible : une personne au clavier ne
           saurait pas où elle se trouve. */
        :focus-visible {
            outline: 3px solid var(--mia-terracotta-light);
            outline-offset: 3px;
            border-radius: 6px;
        }

        /* Respecter les réglages système : la pastille qui pulse et le
           balayage brillant ne doivent pas s'imposer. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .btn::after { display: none; }
        }

        body {
            font-family: "Plus Jakarta Sans", "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--mia-navy);
            background-image: url("/static/mia-fond.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.30);
            -webkit-tap-highlight-color: transparent;
        }

        .layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100vh;
        }

        /* ---------- En-tête ---------- */
        .app-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px 24px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
        }

        /* Titre en dégradé, repris de la charte des autres jeux MIA
           (Chatbot Éternel) : blanc cassé -> terracotta.
           ⚠️ `background-clip: text` découpe le dégradé dans la BOÎTE de
           l'élément, pas dans le texte. Un h1 en pleine largeur d'en-tête
           ne montrerait au texte que le tout début du dégradé — donc du
           blanc uni. `width: fit-content` fait épouser la boîte au texte,
           et le dégradé se déploie sur toute sa longueur. */
        .app-header h1 {
            width: fit-content;
            font-size: clamp(1.35rem, 2.8vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(115deg,
                        var(--text-primary) 0%,
                        var(--mia-terracotta-light) 62%,
                        var(--mia-terracotta) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Le texte étant transparent, l'ombre du body le grisrait. */
            text-shadow: none;
        }

        .app-header p {
            font-size: 0.95rem;
            font-weight: 400;
            font-style: italic;
            color: var(--text-muted);
        }

        .header-text { flex: 1; min-width: 0; }
        /* -------- Indicateur de liaison -------- */
        .link-state {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .link-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #6dd68c;
            flex-shrink: 0;
        }

        .link-state.offline {
            background: rgba(240, 112, 112, 0.22);
            border-color: #f07070;
            color: #ffd9d9;
        }

        .link-state.offline .link-dot {
            background: #f07070;
            animation: pulse 1.2s ease-in-out infinite;
        }

        /* Serveur injoignable : l'état affiché n'est plus fiable, on le dit
           visuellement au lieu de laisser croire qu'il est à jour. */
        body.offline .main-grid { opacity: 0.5; filter: saturate(0.6); }

        .mia-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            opacity: 0.95;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        /* ---------- Grille principale ---------- */
        .main-grid {
            display: grid;
            /* La caméra prend la colonne la plus large ET toute la hauteur :
               c'est la vue qui sert à juger le cadrage du plateau. */
            grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        .card {
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        /* La carte caméra prend toute la hauteur restante de sa colonne. */
        .card.stretch { flex: 1; }

        .card-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-muted);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .card-head .card-title { flex: 1; }

        .switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .switch input { accent-color: var(--mia-terracotta); cursor: pointer; }

        /* ---------- Statut ---------- */
        .status-line {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background var(--transition), box-shadow var(--transition);
        }

        .status-dot.playing {
            background: var(--mia-terracotta-light);
            box-shadow: 0 0 0 4px rgba(212, 132, 126, 0.22);
            animation: pulse 1.8s ease-in-out infinite;
        }

        .status-dot.finished { background: #6dd68c; box-shadow: 0 0 0 4px rgba(109, 214, 140, 0.20); }
        .status-dot.error { background: #f07070; box-shadow: 0 0 0 4px rgba(240, 112, 112, 0.20); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .status-text { font-size: 1.05rem; font-weight: 700; }
        .status-detail { font-size: 0.86rem; color: var(--text-secondary); }

        .badges { display: flex; gap: 8px; flex-wrap: wrap; }

        .badge {
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .badge.robot { background: rgba(181, 96, 90, 0.25); border-color: var(--mia-terracotta); color: #fff; }
        .badge.human { background: rgba(42, 90, 140, 0.35); border-color: var(--mia-navy-light); color: #fff; }

        /* ---------- Plateau ---------- */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 260px;
            /* auto vertical : centre le plateau dans la hauteur restante
               plutôt que de le laisser flotter en haut d'une carte étirée
               par la colonne voisine. */
            margin: auto;
        }

        .cell {
            background: rgba(13, 40, 64, 0.45);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.8rem, 7vw, 3rem);
            font-weight: 800;
            transition: all var(--transition);
        }

        .cell.cube {
            color: var(--mia-terracotta-light);
            background: rgba(181, 96, 90, 0.22);
            border-color: var(--mia-terracotta);
        }

        .cell.cylinder {
            color: #8fb8e0;
            background: rgba(42, 90, 140, 0.28);
            border-color: var(--mia-navy-light);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .legend span { display: flex; align-items: center; gap: 7px; }
        .legend i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

        /* ---------- Caméra ---------- */
        .camera-wrap {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(13, 40, 64, 0.5);
            border: 1px solid var(--border);
            /* Pas d'aspect-ratio figé : l'image est PORTRAIT (480x640) en
               plein cadre et presque carrée une fois recadrée sur le
               plateau. Un cadre fixe rognait le plateau. */
            flex: 1;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* contain, jamais cover : on ne rogne JAMAIS le plateau. Et
           width/height 100% (pas auto) pour que l'image OCCUPE le cadre —
           en auto elle resterait à sa taille naturelle, minuscule. */
        .camera-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            /* Un élément flex refuse par défaut de rétrécir sous sa largeur
               intrinsèque (min-width: auto) : l'image de 403 px poussait
               toute la page en débordement horizontal sur mobile. */
            min-width: 0;
            min-height: 0;
        }

        .camera-wrap .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            text-align: center;
            padding: 20px;
        }

        /* ---------- Boutons ---------- */
        .actions { display: flex; flex-direction: column; gap: 10px; }

        /* -------- Boutons « brillants » --------
           Volume donné par trois couches : un dégradé vertical (clair en
           haut, sombre en bas), un liseré interne clair sur l'arête
           supérieure, une ombre interne sombre en bas. Le ::before ajoute
           le reflet du haut, le ::after balaie une brillance au survol. */
        .btn {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-align: left;
            cursor: pointer;
            isolation: isolate;
            transition: transform 0.14s ease, filter var(--transition),
                        box-shadow var(--transition);
        }

        .btn > * { position: relative; z-index: 1; }

        /* ⚠️ `display: flex` écrase le `display: none` que le navigateur
           applique à [hidden] : sans cette règle, le bouton « Arrêter »
           reste visible en permanence. */
        .btn[hidden] { display: none; }

        /* Reflet permanent sur la moitié haute (l'effet « verre »). */
        .btn::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 48%;
            border-radius: 14px 14px 40% 40% / 14px 14px 100% 100%;
            background: linear-gradient(180deg,
                        rgba(255, 255, 255, 0.30),
                        rgba(255, 255, 255, 0.06) 70%,
                        rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        /* Balayage lumineux au survol. */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-120%);
            background: linear-gradient(105deg,
                        transparent 35%,
                        rgba(255, 255, 255, 0.30) 50%,
                        transparent 65%);
            pointer-events: none;
        }

        .btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform 0.7s ease; }

        .btn .icon { font-size: 1.3rem; flex-shrink: 0; line-height: 1; }
        .btn .label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

        .btn .sub {
            font-size: 0.76rem;
            font-weight: 500;
            letter-spacing: 0;
            color: rgba(255, 255, 255, 0.78);
        }

        .btn:hover:not(:disabled) { filter: brightness(1.08); }
        .btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
        .btn:disabled { opacity: 0.42; cursor: not-allowed; }

        /* Action principale : terracotta de la charte. */
        .btn.primary {
            background: linear-gradient(180deg,
                        var(--mia-terracotta-light) 0%,
                        var(--mia-terracotta) 45%,
                        var(--mia-terracotta-dark) 100%);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.30),
                0 0 32px rgba(181, 96, 90, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.42),
                inset 0 -2px 0 rgba(0, 0, 0, 0.22);
        }

        /* Même logique, autre couleur de la charte : navy. */
        .btn.secondary {
            background: linear-gradient(180deg,
                        var(--mia-navy-light) 0%,
                        var(--mia-navy) 50%,
                        var(--mia-navy-dark) 100%);
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -2px 0 rgba(0, 0, 0, 0.24);
        }

        /* Arrêt : navy très sombre, pour ne pas rivaliser avec « Lancer ». */
        .btn.danger {
            background: linear-gradient(180deg,
                        #2b3f52 0%, #1b2c3d 50%, #101d2a 100%);
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -2px 0 rgba(0, 0, 0, 0.26);
        }

        .btn.danger .icon { color: #f07070; }

        /* -------- Réglages discrets (pas pour le grand public) -------- */
        .actions-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 2px;
        }

        .btn.tool {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 8px;
            border-radius: 11px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-align: center;
            opacity: 0.62;
            background: linear-gradient(180deg,
                        rgba(42, 90, 140, 0.55) 0%,
                        rgba(26, 58, 92, 0.55) 50%,
                        rgba(13, 40, 64, 0.60) 100%);
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(0, 0, 0, 0.20);
        }

        .btn.tool:hover:not(:disabled) { opacity: 1; }
        .btn.tool::before { height: 44%; }
        .btn.tool .icon { font-size: 1.1rem; }

        .toast {
            padding: 11px 15px;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 600;
            border: 1px solid;
            display: none;
        }

        .toast.show { display: block; }
        .toast.info { background: rgba(42, 90, 140, 0.30); border-color: var(--mia-navy-light); }
        .toast.error { background: rgba(240, 112, 112, 0.20); border-color: #f07070; }

        .footer {
            text-align: center;
            font-size: 0.76rem;
            color: var(--text-muted);
            padding-bottom: 4px;
        }

        /* ---------- Responsive : tablette et mobile ---------- */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .app-header { padding: 12px 16px; gap: 14px; }
            .mia-logo { height: 38px; }
            .btn { padding: 17px 18px; font-size: 1.02rem; }
        }

        @media (max-width: 520px) {
            .layout { padding: 10px; gap: 10px; }
            .card { padding: 16px; }
            .app-header p { display: none; }
        }
    </style>
</head>

<body>
    <div class="layout">

        <header class="app-header">
            <div class="header-text">
                <h1>TicTacToe Reachy</h1>
                <p>Pilotage et suivi de partie en direct</p>
            </div>

            <!-- Sans cet indicateur, un serveur tombé laisserait l'écran
                 figé sur un état périmé, sans que rien ne le signale. -->
            <div class="link-state offline" id="link-state" role="status">
                <span class="link-dot"></span>
                <span id="link-label">Connexion…</span>
            </div>
            <img src="/static/mia-logo.png" alt="MIA — La Maison de l'IA" class="mia-logo">
        </header>

        <main class="main-grid">

            <!-- Colonne gauche : partie + commandes -->
            <div class="column">
            <section class="card">
                <div class="card-title">Partie en cours</div>

                <div class="status-line" aria-live="polite">
                    <span class="status-dot" id="dot"></span>
                    <div>
                        <div class="status-text" id="status-text">Prêt</div>
                        <div class="status-detail" id="status-detail">Lancez une partie pour commencer</div>
                    </div>
                </div>

                <div class="badges">
                    <span class="badge" id="badge-turn">En attente</span>
                    <span class="badge" id="badge-games">0 partie</span>
                </div>

                <!-- role="list" et non "grid" : une grille ARIA exige des
                     role="row" intermédiaires, que la mise en page CSS ne
                     permet pas ici. Une liste de 9 cases décrites est
                     valide et s'annonce correctement. -->
                <div class="board" id="board" role="list"
                     aria-label="Plateau de morpion"></div>

                <div class="legend">
                    <span><i style="background: var(--mia-terracotta)"></i> Reachy — cubes</span>
                    <span><i style="background: var(--mia-navy-light)"></i> Vous — cylindres</span>
                </div>
            </section>

            <section class="card">
                <div class="card-title">Commandes</div>
                <div class="toast" id="toast" role="status" aria-live="polite"></div>
                <div class="actions">
                    <button class="btn primary" id="btn-game">
                        <span class="icon">▶</span>
                        <span class="label">
                            <span>Lancer une partie</span>
                            <span class="sub">Le bras se repose à la fin</span>
                        </span>
                    </button>


                    <button class="btn danger" id="btn-stop" hidden>
                        <span class="icon">■</span>
                        <span class="label">
                            <span>Arrêter</span>
                            <span class="sub">Le bras finit son geste puis se repose</span>
                        </span>
                    </button>

                    <!-- Réglages : volontairement discrets, ils ne
                         s'adressent pas au public d'une démonstration. -->
                    <div class="actions-tools">
                        <button class="btn tool" id="btn-moves"
                                title="Parcourt les 9 cases à vide">
                            <span class="icon">🎯</span>
                            <span>Test mouvements</span>
                        </button>

                        <button class="btn tool" id="btn-calib"
                                title="Vérifier le cadrage du plateau">
                            <span class="icon">⚙</span>
                            <span>Calibrage</span>
                        </button>
                    </div>
                </div>
            </section>
            </div>

            <!-- Colonne droite : caméra pleine hauteur -->
            <section class="card stretch">
                <div class="card-head">
                    <span class="card-title">Vue du robot</span>
                    <label class="switch">
                        <input type="checkbox" id="opt-overlay">
                        <span>Repères</span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="opt-full">
                        <span>Plein cadre</span>
                    </label>
                </div>
                <div class="camera-wrap">
                    <img id="camera" alt="Caméra de Reachy" style="display: none">
                    <div class="placeholder" id="camera-placeholder">Caméra indisponible</div>
                </div>
            </section>
        </main>

        <div class="footer">MIA — La Maison de l'IA · Reachy 2021</div>
    </div>

    <script>
        const PIECES = { 0: '', 1: '✕', 2: '◯' };
        const CLASSES = { 0: '', 1: 'cube', 2: 'cylinder' };
        // Décrit pour les lecteurs d'écran : ✕ et ◯ seuls ne veulent rien
        // dire, et la couleur ne se lit pas.
        const PIECE_NAMES = { 0: 'vide', 1: 'cube de Reachy', 2: 'votre cylindre' };

        const board = document.getElementById('board');
        const cells = [];
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.setAttribute('role', 'listitem');
            board.appendChild(cell);
            cells.push(cell);
        }

        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const statusDetail = document.getElementById('status-detail');
        const badgeTurn = document.getElementById('badge-turn');
        const badgeGames = document.getElementById('badge-games');
        const toast = document.getElementById('toast');
        const btnGame = document.getElementById('btn-game');
        const btnMoves = document.getElementById('btn-moves');
        const btnCalib = document.getElementById('btn-calib');
        const btnStop = document.getElementById('btn-stop');

        const STATUS = {
            idle: 'Prêt',
            playing: 'Partie en cours',
            finished: 'Partie terminée',
            error: 'Erreur',
        };

        const WINNER = {
            robot: 'Reachy a gagné',
            human: 'Vous avez gagné !',
            nobody: 'Match nul',
            aborted: 'Partie annulée',
            stopped: 'Partie arrêtée',
        };

        function showToast(message, kind = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + kind;
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.className = 'toast', 6000);
        }

        // Dernier état connu : l'activation des boutons dépend à la fois de
        // lui ET de la liaison. Les deux sources se croisant, une fonction
        // unique décide — sinon un bouton désactivé par une coupure peut ne
        // jamais être réactivé (« Arrêter » restait grisé pour toujours).
        let lastData = null;

        function applyControls() {
            const offline = document.body.classList.contains('offline');
            const running = lastData ? lastData.robot.running : null;
            const busy = lastData ? lastData.robot.busy : true;

            [btnGame, btnMoves, btnCalib].forEach(
                b => b.disabled = offline || busy);
            // « Arrêter » vaut pour toute action en cours, pas seulement
            // une partie : le parcours des cases s'interrompt aussi.
            btnStop.hidden = running === null;
            btnStop.disabled = offline;
        }

        function render(data) {
            lastData = data;
            const game = data.game;
            const robot = data.robot;

            game.board.forEach((piece, i) => {
                cells[i].textContent = PIECES[piece] || '';
                cells[i].className = 'cell ' + (CLASSES[piece] || '');
                cells[i].setAttribute('aria-label',
                    'Case ' + (i + 1) + ' : ' + PIECE_NAMES[piece]);
            });

            dot.className = 'status-dot ' + game.status;
            statusText.textContent = game.winner
                ? (WINNER[game.winner] || game.winner)
                : (STATUS[game.status] || game.status);
            statusDetail.textContent = robot.last_error
                ? robot.last_error
                : (game.message || 'Lancez une partie pour commencer');

            if (game.current_player === 'robot') {
                badgeTurn.textContent = 'Au tour de Reachy';
                badgeTurn.className = 'badge robot';
            } else if (game.current_player === 'human') {
                badgeTurn.textContent = 'À vous de jouer';
                badgeTurn.className = 'badge human';
            } else {
                badgeTurn.textContent = 'En attente';
                badgeTurn.className = 'badge';
            }

            const n = game.games_played;
            badgeGames.textContent = n + (n > 1 ? ' parties' : ' partie');

            // Un seul bras : tout est grisé pendant qu'une action tourne.
            applyControls();
        }

        async function post(url, bouton) {
            try {
                const r = await fetch(url, { method: 'POST' });
                if (r.status === 409) {
                    const d = await r.json();
                    showToast('Robot occupé : ' + d.detail, 'error');
                } else if (!r.ok) {
                    showToast('Échec (HTTP ' + r.status + ')', 'error');
                } else {
                    showToast('Action lancée', 'info');
                }
            } catch (e) {
                showToast('Serveur injoignable', 'error');
            }
        }

        btnGame.onclick = () => post('/api/game');
        btnMoves.onclick = () => post('/api/moves-check');
        btnStop.onclick = () => post('/api/stop');
        btnCalib.onclick = () => showToast(
            'Calibration : à lancer depuis le robot pour le moment (clics souris requis).', 'info');

        // -------- Liaison avec le serveur --------
        // Le serveur renvoie l'état au moins toutes les 8 s (battement) :
        // au-delà de ce délai sans message, la liaison est considérée
        // perdue et l'affichage cesse de se faire passer pour à jour.
        const LINK_TIMEOUT_MS = 20000;
        const linkState = document.getElementById('link-state');
        const linkLabel = document.getElementById('link-label');
        let linkWatchdog = null;

        let currentSource = null;

        function setLink(online) {
            linkState.classList.toggle('offline', !online);
            document.body.classList.toggle('offline', !online);
            linkLabel.textContent = online ? 'En direct' : 'Connexion perdue';
            applyControls();
        }

        function dropAndReconnect() {
            setLink(false);
            if (currentSource) {
                currentSource.close();
                currentSource = null;
            }
            setTimeout(connect, 3000);
        }

        function pingWatchdog() {
            clearTimeout(linkWatchdog);
            // Un flux resté ouvert mais muet ne déclenche jamais onerror :
            // il faut le refermer soi-même, sinon l'interface resterait
            // bloquée sur « Connexion perdue » sans jamais retenter.
            linkWatchdog = setTimeout(dropAndReconnect, LINK_TIMEOUT_MS);
        }

        function connect() {
            const source = new EventSource('/api/events');
            currentSource = source;

            source.onmessage = e => {
                setLink(true);
                pingWatchdog();
                render(JSON.parse(e.data));
            };

            source.onerror = () => {
                if (currentSource !== source) return;  // déjà remplacé
                clearTimeout(linkWatchdog);
                dropAndReconnect();
            };
        }
        connect();

        // Rafraîchissement de l'image caméra.
        // Par défaut recadrée sur la zone calibrée du plateau : la caméra
        // voit tout le bureau, ce qui noie le jeu.
        const camera = document.getElementById('camera');
        const placeholder = document.getElementById('camera-placeholder');
        const optOverlay = document.getElementById('opt-overlay');
        const optFull = document.getElementById('opt-full');

        // Boucle auto-programmée plutôt qu'un setInterval : elle n'empile
        // pas les requêtes quand le serveur traîne, et espace les essais
        // quand il ne répond plus (au lieu de le marteler chaque seconde).
        const CAMERA_PERIOD_MS = 1000;
        const CAMERA_MAX_DELAY_MS = 10000;
        let cameraDelay = CAMERA_PERIOD_MS;

        const CAMERA_TIMEOUT_MS = 8000;

        function refreshCamera() {
            const params = new URLSearchParams({ t: Date.now() });
            if (!optFull.checked) params.set('crop', 'true');
            if (optOverlay.checked) params.set('overlay', 'true');

            const img = new Image();
            let fini = false;

            // Une requête qui ne se termine ni n'échoue arrêterait la boucle
            // pour de bon : ce garde-fou la relance quoi qu'il arrive.
            const secours = setTimeout(() => termine(false), CAMERA_TIMEOUT_MS);

            function termine(succes) {
                if (fini) return;
                fini = true;
                clearTimeout(secours);
                img.onload = img.onerror = null;

                if (succes) {
                    camera.src = img.src;
                    camera.style.display = 'block';
                    placeholder.style.display = 'none';
                    cameraDelay = CAMERA_PERIOD_MS;
                } else {
                    camera.style.display = 'none';
                    placeholder.style.display = 'flex';
                    cameraDelay = Math.min(cameraDelay * 2, CAMERA_MAX_DELAY_MS);
                }
                setTimeout(refreshCamera, cameraDelay);
            }

            img.onload = () => termine(true);
            img.onerror = () => termine(false);
            img.src = '/api/camera.jpg?' + params;
        }
        refreshCamera();
    </script>
</body>

</html>
